# Visual theme for the FBC Stats app (app.py). Streamlit reads this file when
# launched from this folder. No secrets here — the API key lives in
# ~/.streamlit/secrets.toml.

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1E5B43"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F1F3EE"
textColor = "#18221D"
linkColor = "#1E5B43"
borderColor = "#E2E5DE"
dataframeBorderColor = "#E2E5DE"
dataframeHeaderBackgroundColor = "#F4F5F1"
showWidgetBorder = true
baseRadius = "0.6rem"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap, serif"
greenColor = "#1E7A4C"
redColor = "#B42318"
